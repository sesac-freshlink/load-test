# 선착순 대기열 부하 테스트 Job (dev 클러스터, 네임스페이스 freshlink).
# 스크립트는 ConfigMap k6-openrun-script, 설정 값은 ConfigMap k6-openrun-env. scripts/run-round.ps1 이 둘을 만들고 이 Job을 올린다.
apiVersion: batch/v1
kind: Job
metadata:
  name: k6-openrun
  namespace: freshlink
spec:
  backoffLimit: 0                 # 실패해도 다시 돌리지 않는다 (가상 고객이 두 번 줄 서지 않게)
  ttlSecondsAfterFinished: 7200   # 끝나고 2시간 뒤 Job·파드를 지운다 (그 전에 로그를 본다)
  template:
    spec:
      restartPolicy: Never
      affinity:
        podAntiAffinity:          # order-service와 다른 노드에 둔다 (부하 발생기가 측정 대상 CPU를 뺏지 않게)
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: order-service
      containers:
        - name: k6
          image: grafana/k6:1.3.0
          args: ["run", "/scripts/openrun-queue.js"]
          envFrom:
            - configMapRef:
                name: k6-openrun-env
          resources:
            requests:
              cpu: 1000m
              memory: 2Gi
            limits:
              memory: 3Gi   # VU 2,000개에 약 0.5GB였다(11/17 로컬 실측). 5,000명이면 약 1.3GB
          volumeMounts:
            - name: script
              mountPath: /scripts
      volumes:
        - name: script
          configMap:
            name: k6-openrun-script
